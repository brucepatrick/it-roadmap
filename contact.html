<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; color: #1a1a1a; background: #fff; padding: 20px; max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; color: #1a1a1a; }
  .subtitle { font-size: 14px; color: #555; margin-bottom: 20px; line-height: 1.6; }
  .form-box { background: #f7f7f7; border: 1px solid #e0e0e0; border-radius: 8px; padding: 16px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
  input, textarea { width: 100%; font-family: Arial, sans-serif; font-size: 13px; color: #1a1a1a; background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 9px 12px; }
  input:focus, textarea:focus { outline: none; border-color: #4a86e8; background: #f0f4ff; }
  textarea { min-height: 140px; resize: vertical; line-height: 1.5; }
  button { background: #4a86e8; color: #fff; font-family: Arial, sans-serif; font-size: 13px; font-weight: 600; padding: 9px 20px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
  button:hover { background: #1a56c4; }
  .footer { text-align: center; font-size: 12px; color: #888; margin-top: 20px; padding-top: 16px; border-top: 1px solid #e8e8e8; }
</style>
</head>
<body>

<h1>Contact Us</h1>
<p class="subtitle">Have a question, suggestion, or feedback about the IT Engineering &amp; Automation Roadmap? Use this page to get in touch with the project team and we will get back to you as soon as we can.</p>

<div class="form-box">
  <form action="#" method="post">
    <div class="field">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" required></textarea>
    </div>
    <button type="submit">Submit</button>
  </form>
</div>

<div class="footer">IT Engineering &amp; Automation Roadmap</div>

</body>
</html>
